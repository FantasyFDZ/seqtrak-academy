<!doctype html>
<html lang="zh-CN" data-skin="body" data-fx="rich">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>开发用：小课堂 66 关的封面</title>
  <script>
    // 开发用的页面，应用里没有地方链到这里：把小课堂每一关的封面（public/js/classroom-covers.js）都摆出来，看有没有画错、有没有两张太像。
    // 打开：/js/dev/covers.html　　?skin=neon 换成霓虹配色　?still 不动（截图用）　?fx=calm 克制档（也不动）
    {
      const q = new URLSearchParams(location.search);
      const root = document.documentElement;
      if (q.get('skin') === 'neon') root.dataset.skin = 'neon';
      if (q.get('fx') === 'calm') root.dataset.fx = 'calm';
      if (q.has('still')) root.dataset.still = '';
      document.querySelector('meta[name="color-scheme"]').content = root.dataset.skin === 'neon' ? 'dark' : 'light';
    }
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/classroom.css">
  <link rel="stylesheet" href="/css/classroom-select.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: block; overflow: hidden; }
    #page { box-sizing: border-box; height: 100%; overflow-y: auto; padding: 18px 22px 40px; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .note { margin: 0 0 14px; font-size: 13px; color: var(--text-2); }
    .set { margin-bottom: 18px; }
    .set h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 16px; }
    .set h2 .ic { width: 34px; height: 34px; padding: 5px; border-radius: 9px; background: var(--c); color: var(--on-bright); }
    .set h2 small { font: 700 12.5px var(--mono); color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; align-items: start; }
    .one { display: grid; gap: 6px; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
    .one .big { height: 132px; display: grid; place-items: center; border-radius: 9px; background: var(--cs-art); color: var(--cs-ink); }
    .one .big .cl-cover { width: 112px; height: 112px; }
    .one .small { display: flex; align-items: center; gap: 6px; }
    .one .small span { width: 38px; height: 38px; padding: 5px; border-radius: 9px; }
    .one .small .todo { background: color-mix(in srgb, var(--c) 13%, var(--field)); color: color-mix(in srgb, var(--c) 78%, var(--text)); }
    .one .small .done { background: var(--c); color: var(--on-bright); }
    .one .small .tiny { width: 22px; height: 22px; padding: 2px; border-radius: 5px; background: color-mix(in srgb, var(--c) 13%, var(--field)); color: color-mix(in srgb, var(--c) 78%, var(--text)); }
    .one b { font-size: 13px; line-height: 1.3; }
    .one b i { margin-right: 6px; font: 800 12px var(--mono); font-style: normal; color: color-mix(in srgb, var(--c) 76%, var(--text)); }
    .one em { font-size: 12px; font-style: normal; color: var(--muted); line-height: 1.35; }
    .one.missing { outline: 2px dashed var(--bad); }
  </style>
</head>
<body>
  <main id="page">
    <h1>小课堂 66 关的封面</h1>
    <p class="note" id="note"></p>
    <div id="host"></div>
  </main>
  <script type="module">
    import { LINES, OPEN_LEVELS, UNITS, KINDS } from '/js/content/classroom.js';
    import { coverSvg, lineIcon, hasCover } from '/js/classroom-covers.js';
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const host = document.getElementById('host');
    const seen = new Map();
    let same = 0;
    let missing = 0;
    for (const line of LINES) {
      const levels = OPEN_LEVELS.filter((l) => l.line === line.id);
      const set = document.createElement('section');
      set.className = 'set cl-select';
      set.style.setProperty('--c', `var(--${line.color})`);
      set.innerHTML = `<h2><span class="ic">${lineIcon(line.id)}</span>${esc(line.name)}<small>${levels.length} 关</small></h2><div class="grid">${levels.map((l) => {
        const small = coverSvg(l);
        if (l.kind !== 'boss') {
          if (seen.has(small)) same++;
          seen.set(small, l.id);
        }
        if (!hasCover(l)) missing++;
        const unit = UNITS.find((u) => u.id === l.unit);
        return `<div class="one ${hasCover(l) ? '' : 'missing'}"><div class="big">${coverSvg(l, { anim: true })}</div>
          <div class="small"><span class="todo">${small}</span><span class="done">${small}</span><span class="tiny">${small}</span></div>
          <b><i>${l.id}</i>${esc(l.title)}</b><em>${unit ? `${esc(unit.name.replace(/^.*· /, ''))} · ` : ''}${esc(KINDS[l.kind].label)} · ${esc(l.about)}</em></div>`;
      }).join('')}</div>`;
      host.append(set);
    }
    document.getElementById('note').textContent = `一共 ${OPEN_LEVELS.length} 关。每张：上面是大封面（舞台、卡片上用，丰富档会动），下面三个小的是列表上没学的、学过的，和 22 像素时的样子。`
      + `四个大关有意画成一个样子；别的关里一模一样的有 ${same} 对，还没画（先用这条线的图标顶着、红色虚线框）的有 ${missing} 张。`;
  </script>
</body>
</html>
